<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>毛毛格擋</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #f4f4f4;
    font-family: "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    overscroll-behavior: none;
    -webkit-touch-callout: none;
  }
  body {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 56px;
    overflow: auto;
    user-select: none;
    touch-action: none;
    cursor: pointer;
  }
  body.dead { background: #808080; cursor: default; }
  #stage {
    position: relative;
    width: min(480px, 70vh, 86vw);
    aspect-ratio: 1;
    flex: 0 0 auto;
    background: #000;
    border: 1px solid #1c1c1c;
    overflow: hidden;
  }
  #view {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    transform: scale(0.66);
    transition: transform 160ms linear;
    pointer-events: none;
  }
  #stage.windup.left #view { transform: translate(46px, 12px) scale(0.62); }
  #stage.windup.right #view { transform: translate(-46px, 12px) scale(0.62); }
  #stage.strike #view { transform: scale(1); filter: none; }
  #stage[data-state="open"] {
    box-shadow: inset 0 0 0 8px #e2b340, 0 0 36px rgba(226, 179, 64, 0.55);
    border-color: #e2b340;
  }
  #stage[data-state="open"] #view {
    transform: scale(1.05);
    transition: none;
    filter: brightness(1.16);
  }
  #flash {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
  }
  #flash.parry { background: rgba(226, 179, 64, 0.34); opacity: 1; }
  #banner {
    position: absolute;
    z-index: 2;
    top: 16px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 44px;
    font-weight: 800;
    letter-spacing: 0.08em;
    pointer-events: none;
    text-shadow: 0 2px 14px #000;
    min-height: 1.1em;
  }
  #banner.now { color: #e2b340; }
  #banner.parry { color: #ffe7a3; }
  #banner.early, #banner.late { color: #8d8d8d; font-size: 28px; letter-spacing: 0.14em; }
  #overlay {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 28px;
    gap: 10px;
    background: rgba(0, 0, 0, 0.64);
  }
  #overlay[hidden] { display: none !important; }
  .ov-title { font-size: 34px; font-weight: 700; line-height: 1.1; }
  #overlay p { margin: 0; max-width: 34ch; color: #dedede; font-size: 16px; line-height: 1.45; }
  #overlay .ov-hint { color: #9a9a9a; }
  #stage.hit { animation: shake 180ms linear; }
  @keyframes shake {
    0% { transform: translateX(0); }
    20% { transform: translateX(-12px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-7px); }
    80% { transform: translateX(4px); }
    100% { transform: translateX(0); }
  }
  .readout { min-width: 300px; max-width: 380px; }
  .label {
    color: #9a9a9a;
    font-size: 15px;
    letter-spacing: 0.04em;
  }
  .total {
    font-size: 84px;
    line-height: 0.95;
    font-variant-numeric: tabular-nums;
    margin: 6px 0 0;
  }
  .unit { font-size: 28px; color: #cfcfcf; margin-left: 6px; }
  .rate { color: #bdbdbd; font-size: 16px; font-variant-numeric: tabular-nums; min-height: 1.4em; margin: 8px 0 16px; }
  .hpblock { margin-top: 4px; }
  .hprow { display: flex; align-items: baseline; gap: 10px; }
  #hp { font-size: 28px; font-variant-numeric: tabular-nums; font-weight: 700; }
  #hp.zero { color: #ff5b5b; }
  .barwrap { position: relative; height: 36px; margin-top: 4px; }
  .bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 12px;
    background: #1c1c1c;
    border-radius: 99px;
    overflow: hidden;
  }
  #barfill { height: 100%; width: 100%; background: #e2b340; }
  #dmg {
    position: absolute;
    top: 0;
    left: 100%;
    color: #ff4d4d;
    font-size: 22px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    opacity: 0;
    pointer-events: none;
    text-shadow: 0 1px 2px #000;
  }
  #dmg.show { animation: dmgpop 520ms ease-out; }
  @keyframes dmgpop {
    0% { opacity: 1; transform: translate(-50%, 4px); }
    100% { opacity: 0; transform: translate(-50%, -14px); }
  }
  .status { font-size: 28px; line-height: 1.35; margin: 14px 0 6px; min-height: 1.35em; }
  .meta { color: #bdbdbd; font-size: 16px; line-height: 1.5; font-variant-numeric: tabular-nums; }
  .help { color: #8d8d8d; font-size: 15px; line-height: 1.45; margin-top: 12px; max-width: 36ch; }
  .langs { display: flex; gap: 8px; margin-top: 16px; }
  .langs button, #save-btn {
    background: #1c1c1c;
    color: #fff;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 6px 12px;
    font: inherit;
    cursor: pointer;
  }
  .langs button[aria-pressed="true"] { border-color: #f4f4f4; }
  .board-title { margin: 18px 0 8px; font-size: 15px; color: #9a9a9a; letter-spacing: 0.04em; }
  .board { list-style: none; margin: 0; padding: 0; font-variant-numeric: tabular-nums; font-size: 14px; }
  .board li {
    display: grid;
    grid-template-columns: 1.6em 1fr auto auto;
    gap: 8px;
    padding: 3px 0;
    color: #d0d0d0;
  }
  .board .empty { display: block; color: #8d8d8d; }
  #end {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: #808080;
    color: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow: auto;
    padding: 48px 24px 24px;
    text-align: center;
    cursor: default;
    touch-action: pan-y;
  }
  #end[hidden] { display: none !important; }
  #end-score { font-size: 72px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; margin: 0; }
  #end-title { font-size: 40px; letter-spacing: 0.06em; margin: 18px 0 12px; font-weight: 800; }
  #end p { max-width: 40rem; margin: 0 0 12px; font-size: 17px; line-height: 1.55; }
  #score-form {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin: 8px 0 4px;
    cursor: auto;
  }
  #score-form label { font-size: 15px; }
  #name {
    font: inherit;
    font-size: 18px;
    width: 12ch;
    padding: 6px 8px;
    border: 1px solid #1a1a1a;
    background: #808080;
    color: #1a1a1a;
    border-radius: 6px;
  }
  #end #save-btn, #end .langs button {
    background: #808080;
    color: #1a1a1a;
    border: 1px solid #1a1a1a;
  }
  #end .langs button[aria-pressed="true"] { font-weight: 700; }
  #save-msg { width: 100%; min-height: 1.3em; font-size: 14px; }
  #end .board-title { color: #1a1a1a; font-size: 18px; margin-top: 22px; }
  #end .board { width: min(520px, 100%); font-size: 16px; }
  #end .board li { color: #1a1a1a; border-bottom: 1px solid #666; }
  #end .board .mine { font-weight: 700; }
  #retry-bar {
    position: sticky;
    bottom: 0;
    z-index: 2;
    width: min(520px, 100%);
    display: flex;
    justify-content: center;
    margin-top: 18px;
    padding: 14px 0 calc(14px + env(safe-area-inset-bottom));
    background: #808080;
  }
  #retry-btn {
    font: inherit;
    font-size: 18px;
    font-weight: 700;
    min-height: 48px;
    min-width: 180px;
    padding: 12px 28px;
    border-radius: 10px;
    border: 2px solid #1a1a1a;
    background: #1a1a1a;
    color: #f4f4f4;
    cursor: pointer;
    touch-action: manipulation;
  }
  #pause-btn {
    margin-top: 12px;
    min-height: 40px;
    background: transparent;
    color: #cfcfcf;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 8px 14px;
    font: inherit;
    cursor: pointer;
    touch-action: manipulation;
  }
  @media (max-width: 860px) {
    body {
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: 6px;
      min-height: 0;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      padding: env(safe-area-inset-top) 0 0;
    }
    #stage { width: min(92vw, 44dvh); margin-top: 6px; }
    #banner { font-size: 32px; top: 8px; }
    .ov-title { font-size: 26px; }
    #overlay { padding: 16px; }
    #overlay p { font-size: 14px; }
    .readout {
      min-width: 0;
      width: 100%;
      max-width: none;
      padding: 0 16px calc(8px + env(safe-area-inset-bottom));
      box-sizing: border-box;
    }
    .total { font-size: 48px; }
    .unit { font-size: 20px; }
    .rate { margin: 2px 0 6px; }
    .status { font-size: 22px; margin: 6px 0 2px; }
    #hp { font-size: 22px; }
    .help, #side-board, #side-board-title { display: none; }
    .langs { margin-top: 8px; }
    .langs button, #pause-btn { min-height: 44px; }
    #end { padding: 24px 16px 8px; }
    #end-score { font-size: 48px; }
    #end-title { font-size: 30px; margin: 12px 0 8px; }
    #end p { font-size: 15px; }
    #name { font-size: 16px; }
    #retry-btn { width: min(100%, 420px); min-height: 52px; font-size: 20px; }
  }
</style>
</head>
<body>

    early: t.early,
    late: t.late,
    hit: t.hit,
    down: t.down,
    paused: t.pausedTitle
  };
  statusEl.textContent = map[key] || "";
}

function showOverlay(title, lines, hint) {
  overlay.replaceChildren();
  const h = document.createElement("div");
  h.className = "ov-title";
  h.textContent = title;
  overlay.append(h);
  for (const line of lines) {
    const p = document.createElement("p");
    p.textContent = line;
    overlay.append(p);
  }
  if (hint) {
    const s = document.createElement("p");
    s.className = "ov-hint";
    s.textContent = hint;
    overlay.append(s);
  }
  overlay.hidden = false;
}

function showStart() {
  const t = T();
  showOverlay(t.startTitle, t.start, t.startHint);
  setStatus("start");
}

function showPause() {
  const t = T();
  showOverlay(t.pausedTitle, t.paused, t.pausedHint);
  setStatus("paused");
}

function applyStatic() {
  const t = T();
  document.documentElement.lang = lang;
  document.title = t.title;
  document.getElementById("score-label").textContent = t.scoreLabel;
  unitEl.textContent = t.unit;
  document.getElementById("hp-label").textContent = t.hp;
  helpEl.textContent = t.help;
  document.getElementById("side-board-title").textContent = t.board;
  document.getElementById("end-board-title").textContent = t.board;
  document.getElementById("name-label").textContent = t.name;
  saveBtn.textContent = t.save;
  nameEl.placeholder = t.needName;
  document.querySelectorAll("[data-lang]").forEach((btn) => {
    btn.setAttribute("aria-pressed", btn.dataset.lang === lang ? "true" : "false");
  });
  fillEndCopy();
  setStatus(statusKey);
  updateHud();
  renderBoards();
}

function fillEndCopy() {
  const t = T();
  document.getElementById("end-title").textContent = t.died;
  document.getElementById("end-p1").textContent = t.p1;
  document.getElementById("end-p2").textContent = t.p2;
  document.getElementById("retry-btn").textContent = t.revive;
  document.getElementById("pause-btn").textContent = t.pauseBtn;
  document.getElementById("end-score").textContent = t.clock(survivedMs / 1000);
}

function setLang(next) {
  if (!STR[next]) return;
  lang = next;
  localStorage.setItem(LANG_KEY, lang);
  applyStatic();
  if (state === "start" && started) showStart();
  if (paused) showPause();
  paintClock(performance.now());
}

function markLoaded(img) {
  if (img.__counted) return;
  img.__counted = true;
  loaded += 1;
  if (!started) {
    const title = overlay.querySelector(".ov-title");
    if (title) title.textContent = T().loading + " " + loaded + " / " + FRAME_COUNT;
  }
  if (loaded === FRAME_COUNT) ready();
}

loadLang();

for (let i = 0; i < FRAME_COUNT; i++) {
  const img = new Image();
  const name = "f" + String(i).padStart(2, "0") + ".jpg";
  frames[i] = img;
  img.onload = () => markLoaded(img);
  img.onerror = () => markLoaded(img);
  img.src = FRAME_DIR + name;
  if (img.complete) markLoaded(img);
}

function setState(next) {
  state = next;
  stage.dataset.state = next;
}

function setBanner(text, kind) {
  banner.textContent = text;
  banner.className = kind || "";
}

function showFrame(index) {
  const img = frames[index % FRAME_COUNT];
  if (img && img.complete && img.naturalWidth) view.src = img.src;
}

function setPose(mode) {
  const side = punchIndex % 2 === 0 ? "left" : "right";
  stage.classList.remove("windup", "strike", "left", "right", "hit");
  flash.className = "";
  if (mode === "windup") stage.classList.add("windup", side);
  if (mode === "open" || mode === "hit" || mode === "block") stage.classList.add("strike", side);
  if (mode === "hit") {
    void stage.offsetWidth;
    stage.classList.add("hit");
  }
  if (mode === "block") flash.className = "parry";
}

function updateHud() {
  const t = T();
  hpEl.textContent = String(hp);
  hpEl.classList.toggle("zero", hp <= 0);
  const pct = Math.max(0, Math.min(1, hp / HP_MAX));
  barEl.style.width = (pct * 100) + "%";
  metaEl.textContent = t.meta(blocked, landed, punches);
}

function popDamage(n) {
  const pct = Math.max(0, Math.min(1, hp / HP_MAX));
  dmgEl.textContent = "-" + n;
  dmgEl.style.left = (pct * 100) + "%";
  dmgEl.classList.remove("show");
  void dmgEl.offsetWidth;
  dmgEl.classList.add("show");
}

function punchRate(at) {
  const elapsed = Math.max(0, at - fightStartedAt);
  return Math.min(FULL_RATE, START_RATE * Math.pow(2, elapsed / DOUBLE_MS));
}

function timingsFor(at) {
  const cycle = 1000 / punchRate(at);
  const windowMs = cycle * 0.18;
  const recoverMs = cycle * 0.22;
  const windupMs = Math.max(0, cycle - windowMs - recoverMs);
  const jitter = windupMs * ((Math.random() - 0.5) * 0.16);
  return { windupMs: Math.max(0, windupMs + jitter), windowMs, recoverMs };
}

function paintClock(now) {
  const t = T();
  let ms = 0;
  if (state === "dead") ms = survivedMs;
  else if (paused) ms = Math.max(0, frozenAt - fightStartedAt);
  else if (state !== "start") ms = Math.max(0, now - fightStartedAt);
  clockEl.textContent = (ms / 1000).toFixed(2);
  const at = state === "dead" ? fightStartedAt + survivedMs : (paused ? frozenAt : now);
  const rate = state === "start" ? START_RATE : punchRate(at);
  rateEl.textContent = t.rate(rate);
}

function ensureAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (err) {}
}

function blip(freq, dur, type) {
  try {
    if (!audioCtx || audioCtx.state !== "running") return;
    const t0 = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.06, t0 + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  } catch (err) {}
}

function ready() {
  const failed = frames.filter((img) => !img.naturalWidth).length;
  if (failed) {
    const t = T();
    showOverlay(t.missingTitle, [failed + " — " + t.missing[0]], "");
    setStatus("missing");
    return;
  }
  started = true;
  showFrame(0);
  setPose("windup");
  setState("start");
  updateHud();
  showStart();
  paintClock(performance.now());
  loadBoard();
  requestAnimationFrame(tick);
}

function begin(now) {
  hp = HP_MAX;
  punchIndex = 0;
  punches = 0;
  blocked = 0;
  landed = 0;
  blockedThis = false;
  paused = false;
  frameDmg = 0;
  survivedMs = 0;
  lastHighlight = "";
  stage.dataset.paused = "0";
  fightStartedAt = now;
  lastNow = now;
  document.body.classList.remove("dead");
  endEl.hidden = true;
  saveBtn.disabled = false;
  saveMsg.textContent = "";
  updateHud();
  setBanner("", "");
  showFrame(0);
  setPose("windup");
  setState("wait");
  overlay.hidden = true;
  setStatus("ready");
  phaseUntil = now + READY_MS;
  paintClock(now);
}

function arm(at) {
  blockedThis = false;
  const timing = timingsFor(at);
  windupEnds = at + timing.windupMs;
  windowEnds = windupEnds + timing.windowMs;
  cycleEnds = windowEnds + timing.recoverMs;
  showFrame(punchIndex);
  setPose("windup");
  setState("windup");
  setBanner("", "");
  setStatus(punchIndex % 2 === 0 ? "left" : "right");
  view.style.transitionDuration = Math.min(160, Math.max(16, timing.windupMs)) + "ms";
}

function openWindow() {
  setState("open");
  setPose("open");
  setBanner(T().nowBanner, "now");
  setStatus("now");
  view.style.transitionDuration = "0ms";
  blip(880, 0.045, "square");
}

function miss() {
  punches += 1;
  landed += 1;
  hp -= PUNCH_DAMAGE;
  setBanner("", "");
  if (hp < 0) hp = 0;
  frameDmg += PUNCH_DAMAGE;
  updateHud();
  setPose("hit");
  setStatus("hit");
  blip(120, 0.09, "sawtooth");
  if (hp <= 0) {
    die(windowEnds);
    return;
  }
  setState("recover");
  punchIndex += 1;
}

function blockPunch(now) {
  if (blockedThis || state !== "open" || now > windowEnds) return;
  blockedThis = true;
  punches += 1;
  blocked += 1;
  updateHud();
  setPose("block");
  setBanner(T().blockBanner, "parry");
  setStatus("blocked");
  blip(1320, 0.06, "square");
  setState("recover");
  punchIndex += 1;
}

function die(at) {
  hp = 0;
  updateHud();
  survivedMs = Math.max(0, at - fightStartedAt);
  setState("dead");
  setStatus("down");
  setBanner("", "");
  showEnd();
}

function showEnd() {
  document.body.classList.add("dead");
  fillEndCopy();
  const savedName = localStorage.getItem(NAME_KEY) || "";
  nameEl.value = [...savedName].slice(0, 10).join("");
  saveBtn.disabled = false;
  saveMsg.textContent = "";
  endEl.hidden = false;
  paintClock(performance.now());
  loadBoard();
}

function act(now) {
  if (!started) return;
  ensureAudio();
  if (paused) {
    paused = false;
    stage.dataset.paused = "0";
    const gap = now - frozenAt;
    if (gap > 0) {
      fightStartedAt += gap;
      phaseUntil += gap;
      windupEnds += gap;
      windowEnds += gap;
      cycleEnds += gap;
    }
    overlay.hidden = true;
    setStatus(state === "open" ? "now" : (punchIndex % 2 === 0 ? "left" : "right"));
    if (state === "wait") setStatus("ready");
    if (state === "recover") setStatus(blockedThis ? "blocked" : "hit");
    return;
  }
  if (state === "start" || state === "dead") {
    begin(now);
    return;
  }
  if (state === "open" && now <= windowEnds) {
    blockPunch(now);
    return;
  }
  if (state === "windup" || state === "wait") {
    setBanner(T().early, "early");
    setStatus("early");
    return;
  }
  if (state === "open") {
    setBanner(T().late, "late");
    setStatus("late");
  }
}

function togglePause() {
  if (!started || state === "start" || state === "dead") return;
  if (!paused) {
    paused = true;
    frozenAt = performance.now();
    stage.dataset.paused = "1";
    showPause();
    paintClock(frozenAt);
    return;
  }
  act(performance.now());
}

function tick(now) {
  requestAnimationFrame(tick);
  if (!started || paused) return;
  if (lastNow && now - lastNow > 80 && state !== "start" && state !== "dead") {
    const extra = now - lastNow - 16;
    phaseUntil += extra;
    windupEnds += extra;
    windowEnds += extra;
    cycleEnds += extra;
    fightStartedAt += extra;
  }
  lastNow = now;
  let guard = 0;
  while (guard++ < 24 && state !== "dead" && state !== "start" && state !== "paused") {
    if (state === "wait" && now >= phaseUntil) arm(phaseUntil);
    else if (state === "windup" && now >= windupEnds) {
      if (now >= windowEnds) miss();
      else openWindow();
    } else if (state === "open" && now >= windowEnds) miss();
    else if (state === "recover" && now >= cycleEnds) arm(cycleEnds);
    else break;
  }
  if (frameDmg) {
    popDamage(frameDmg);
    frameDmg = 0;
  }
  paintClock(now);
}

function cleanName(raw) {
  const trimmed = String(raw || "").replace(/[\u0000-\u001f*]/g, "").trim();
  return [...trimmed].slice(0, 10).join("");
}

function normalize(list) {
  const rows = [];
  const seen = new Set();
  for (const row of list || []) {
    if (!row || typeof row.name !== "string") continue;
    const name = cleanName(row.name);
    const ms = Math.round(Number(row.ms));
    const at = typeof row.at === "string" ? row.at : "";
    if (!name || !Number.isFinite(ms) || ms <= 0 || ms > 3600000 || !at) continue;
    const id = name + "|" + ms + "|" + at;
    if (seen.has(id)) continue;
    seen.add(id);
    rows.push({ name, ms, at });
  }
  rows.sort((a, b) => b.ms - a.ms || (a.at < b.at ? -1 : a.at > b.at ? 1 : 0));
  return rows.slice(0, KEEP_N);
}

function readLocal() {
  try {
    const parsed = JSON.parse(localStorage.getItem(LOCAL_KEY) || "[]");
    return normalize(parsed);
  } catch (err) {
    return [];
  }
}

function writeLocal(list) {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(list));
}

function formatWhen(iso) {
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return "";
  const p = (n) => String(n).padStart(2, "0");
  return date.getFullYear() + "-" + p(date.getMonth() + 1) + "-" + p(date.getDate()) + " " + p(date.getHours()) + ":" + p(date.getMinutes());
}

function renderInto(el, list) {
  el.replaceChildren();
  const top = list.slice(0, TOP_N);
  if (!top.length) {
    const li = document.createElement("li");
    li.className = "empty";
    li.textContent = boardNote || T().empty;
    el.append(li);
    return;
  }
  top.forEach((row, i) => {
    const li = document.createElement("li");
    const id = row.name + "|" + row.ms + "|" + row.at;
    if (id === lastHighlight) li.className = "mine";
    const rank = document.createElement("span");
    rank.textContent = String(i + 1);
    const name = document.createElement("span");
    name.textContent = row.name;
    const score = document.createElement("span");
    score.textContent = (row.ms / 1000).toFixed(2) + " " + T().unit;
    const when = document.createElement("span");
    when.textContent = formatWhen(row.at);
    li.append(rank, name, score, when);
    el.append(li);
  });
}

function renderBoards() {
  renderInto(document.getElementById("side-board"), lastList);
  renderInto(document.getElementById("end-board"), lastList);
}

async function fetchRemote() {
  const resp = await fetch(BOARD_URL, { cache: "no-store" });
  if (resp.status === 404) return [];
  if (!resp.ok) throw new Error(String(resp.status));
  const data = await resp.json();
  return normalize(Array.isArray(data) ? data : []);
}

async function putRemote(list) {
  const resp = await fetch(BOARD_URL, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(list)
  });
  if (!resp.ok) throw new Error(String(resp.status));
}

async function loadBoard() {
  const local = readLocal();
  try {
    const remote = await fetchRemote();
    lastList = normalize(remote.concat(local));
    boardNote = "";
    writeLocal(lastList);
  } catch (err) {
    lastList = local;
    boardNote = local.length ? "" : T().boardDown;
  }
  renderBoards();
}

async function submitScore(event) {
  event.preventDefault();
  event.stopPropagation();
  const name = cleanName(nameEl.value);
  if (!name) {
    saveMsg.textContent = T().needName;
    return;
  }
  if (Math.round(survivedMs) <= 0) return;
  saveMsg.textContent = "";
  saveBtn.disabled = true;
  const at = new Date().toISOString();
  const row = { name, ms: Math.round(survivedMs), at };
  localStorage.setItem(NAME_KEY, name);
  lastHighlight = name + "|" + row.ms + "|" + at;
  let base = readLocal();
  let online = false;
  try {
    base = normalize((await fetchRemote()).concat(base));
    online = true;
  } catch (err) {
    online = false;
  }
  const next = normalize(base.concat([row]));
  writeLocal(next);
  lastList = next;
  renderBoards();
  if (!online) {
    saveMsg.textContent = T().savedLocal;
    saveBtn.disabled = true;
    return;
  }
  try {
    await putRemote(next);
    saveMsg.textContent = T().saved;
    saveBtn.disabled = true;
  } catch (err) {
    saveMsg.textContent = T().savedLocal;
    saveBtn.disabled = true;
  }
}

document.getElementById("score-form").addEventListener("submit", submitScore);

document.getElementById("retry-btn").addEventListener("click", (event) => {
  event.preventDefault();
  event.stopPropagation();
  if (state !== "dead") return;
  act(performance.now());
});

document.getElementById("pause-btn").addEventListener("click", (event) => {
  event.preventDefault();
  event.stopPropagation();
  togglePause();
});

document.addEventListener("click", (event) => {
  const btn = event.target.closest("[data-lang]");
  if (!btn) return;
  event.preventDefault();
  event.stopPropagation();
  setLang(btn.dataset.lang);
});

window.addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  if (event.target.closest("[data-lang], #score-form, #retry-btn, #pause-btn")) return;
  if (state === "dead") return;
  event.preventDefault();
  act(performance.now());
});

window.addEventListener("keydown", (event) => {
  if (event.target.closest("input, textarea")) return;
  if (event.repeat) return;
  if (event.code === "Escape") {
    event.preventDefault();
    togglePause();
    return;
  }
  if (event.code === "Space") {
    if (state === "dead") {
      if (!event.target.closest("#retry-btn")) event.preventDefault();
      return;
    }
    event.preventDefault();
    act(performance.now());
  }
});

loadLang();
applyStatic();
</script>
</body>
</html>
